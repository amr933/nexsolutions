<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF4EE"/>
      <stop offset="1" stop-color="#E8DAD0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CD7663"/>
      <stop offset="1" stop-color="#9C5046"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D7806F"/>
      <stop offset="1" stop-color="#A85A4E"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- shadow -->
  <ellipse cx="256" cy="430" rx="140" ry="26" fill="#3c2820" opacity="0.22"/>
  <!-- body -->
  <rect x="132" y="210" width="248" height="185" rx="34" fill="url(#body)" stroke="#96504a" stroke-width="4"/>
  <!-- gloss -->
  <ellipse cx="190" cy="260" rx="40" ry="38" fill="#ffffff" opacity="0.22"/>
  <!-- lid -->
  <ellipse cx="256" cy="205" rx="130" ry="23" fill="url(#lid)" stroke="#96504a" stroke-width="3"/>
  <!-- lid knob -->
  <circle cx="256" cy="182" r="16" fill="#E6C378" stroke="#A9823C" stroke-width="2"/>
  <ellipse cx="252" cy="178" rx="5" ry="4" fill="#FFF5DC" opacity="0.7"/>
  <!-- handles -->
  <rect x="108" y="270" width="26" height="60" rx="10" fill="#B46455" stroke="#8C463C" stroke-width="2"/>
  <rect x="378" y="270" width="26" height="60" rx="10" fill="#B46455" stroke="#8C463C" stroke-width="2"/>
  <!-- steam -->
  <path d="M200 175 Q185 120 205 75" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M256 165 Q248 105 268 60" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.65"/>
  <path d="M312 175 Q327 115 305 70" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.55"/>
  <!-- herb sprig -->
  <ellipse cx="256" cy="318" rx="20" ry="22" fill="#6D8762" opacity="0.85"/>
  <ellipse cx="270" cy="308" rx="16" ry="18" fill="#78966A" opacity="0.75"/>
</svg>
